document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

             <\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n        <div style=\"padding:10px 22px 22px;border-top:1px solid #E3DACD;display:flex;flex-direction:column;gap:8px;flex-shrink:0;\">\n          <sc-if value=\"{{ isModalWear }}\" hint-placeholder-val=\"{{ false }}\">\n            <button style=\"height:46px;border:none;background:#A3B19B;color:#243626;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;\" sc-camel-on-click=\"{{ modalWearConfirm }}\">✓ I Wore This Today<\u002Fbutton>\n            <button style=\"height:44px;border:1px solid #D8CBB8;background:transparent;color:#6b6459;font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;\" sc-camel-on-click=\"{{ closeModal }}\">Cancel<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isModalHistory }}\" hint-placeholder-val=\"{{ false }}\">\n            <button style=\"height:44px;border:1px solid #D8CBB8;background:transparent;color:#6b6459;font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;\" sc-camel-on-click=\"{{ closeModal }}\">Close<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isModalAuto }}\" hint-placeholder-val=\"{{ false }}\">\n            <button style=\"height:46px;border:none;background:#A3B19B;color:#243626;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;\" sc-camel-on-click=\"{{ modalAutoConfirm }}\">✓ Wear This Today<\u002Fbutton>\n            <button style=\"height:44px;border:1px solid #D8CBB8;background:transparent;color:#6b6459;font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;\" sc-camel-on-click=\"{{ openPickManualToday }}\">Pick Manually Instead<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isModalPicker }}\" hint-placeholder-val=\"{{ false }}\">\n            <button style=\"height:46px;border:none;background:{{ pickerConfirmBg }};color:{{ pickerConfirmColor }};font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;opacity:{{ pickerConfirmOpacity }};\" sc-camel-on-click=\"{{ pickerConfirmClick }}\">{{ pickerConfirmLabel }}<\u002Fbutton>\n            <button style=\"height:44px;border:1px solid #D8CBB8;background:transparent;color:#6b6459;font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;\" sc-camel-on-click=\"{{ closeModal }}\">Cancel<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;bottom:78px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#F9F8F6;border-radius:99px;padding:10px 20px;font-size:12px;font-weight:600;z-index:60;white-space:nowrap;\">{{ toastMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:900}}\">\nconst SK_H='tonal_lux_h', SK_P='tonal_lux_p';\nfunction loadLS(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(e){return d;}}\nfunction saveLS(k,v){localStorage.setItem(k,JSON.stringify(v));}\n\nconst COMBOS = [\n  {id:1,  score:94.20, p:'Black',       sh:'Cognac', sr:'White',            j:'Camel'},\n  {id:2,  score:94.08, p:'Black',       sh:'Cognac', sr:'White',            j:'Light Grey'},\n  {id:3,  score:94.08, p:'Light Grey',  sh:'Black',  sr:'White',            j:'Olive'},\n  {id:4,  score:94.03, p:'Light Grey',  sh:'Black',  sr:'White',            j:'Black'},\n  {id:5,  score:93.79, p:'Oxford Grey', sh:'Black',  sr:'White',            j:'Light Grey'},\n  {id:6,  score:93.73, p:'Black',       sh:'Cognac', sr:'Cream',            j:'Camel'},\n  {id:7,  score:93.53, p:'Light Grey',  sh:'Black',  sr:'White',            j:'Charcoal'},\n  {id:8,  score:93.30, p:'Oxford Grey', sh:'Black',  sr:'White',            j:'Black'},\n  {id:9,  score:93.24, p:'Light Grey',  sh:'Black',  sr:'White',            j:'Dark Brown'},\n  {id:10, score:92.75, p:'Light Grey',  sh:'Black',  sr:'Slate Blue',       j:'Black'},\n  {id:11, score:92.74, p:'Black',       sh:'Cognac', sr:'Cream',            j:'Black'},\n  {id:12, score:92.53, p:'Light Grey',  sh:'Black',  sr:'Mid Grey',         j:'Black'},\n  {id:13, score:92.44, p:'Black',       sh:'Cognac', sr:'Stone',            j:'Black'},\n  {id:14, score:92.40, p:'Oxford Grey', sh:'Black',  sr:'Black Shirt',      j:'Light Grey'},\n  {id:15, score:92.27, p:'Oxford Grey', sh:'Black',  sr:'Cream',            j:'Black'},\n  {id:16, score:92.17, p:'Black',       sh:'Cognac', sr:'Cream',            j:'Light Grey'},\n  {id:17, score:92.12, p:'Light Grey',  sh:'Black',  sr:'Cream',            j:'Black'},\n  {id:18, score:92.05, p:'Light Grey',  sh:'Black',  sr:'Black Shirt',      j:'Olive'},\n  {id:19, score:91.95, p:'Oxford Grey', sh:'Black',  sr:'Light Grey Shirt', j:'Black'},\n  {id:20, score:91.94, p:'Black',       sh:'Cognac', sr:'Light Grey Shirt', j:'Black'},\n  {id:21, score:91.76, p:'Black',       sh:'Cognac', sr:'Cream',            j:'Dark Brown'},\n  {id:22, score:91.54, p:'Oxford Grey', sh:'Black',  sr:'Stone',            j:'Black'},\n  {id:23, score:91.41, p:'Oxford Grey', sh:'Black',  sr:'Black Shirt',      j:'Camel'},\n  {id:24, score:91.37, p:'Dark Brown',  sh:'Cognac', sr:'Cream',            j:'Camel'},\n  {id:25, score:91.28, p:'Oxford Grey', sh:'Black',  sr:'Cream',            j:'Camel'},\n  {id:26, score:90.51, p:'Dark Brown',  sh:'Cognac', sr:'Stone',            j:'Black'},\n  {id:27, score:89.46, p:'Dark Brown',  sh:'Cognac', sr:'Black Shirt',      j:'Camel'},\n  {id:28, score:89.28, p:'Dark Brown',  sh:'Cognac', sr:'Light Grey Shirt', j:'Black'},\n  {id:29, score:89.19, p:'Navy',        sh:'Black',  sr:'Slate Blue',       j:'Light Grey'},\n  {id:30, score:89.11, p:'Dark Brown',  sh:'Cognac', sr:'Stone',            j:'Dark Brown'},\n  {id:31, score:88.88, p:'Navy',        sh:'Black',  sr:'Mid Grey',         j:'Light Grey'},\n  {id:32, score:88.78, p:'Dark Brown',  sh:'Black',  sr:'Stone',            j:'Camel'},\n  {id:33, score:88.78, p:'Dark Brown',  sh:'Cognac', sr:'Stone',            j:'Camel'},\n  {id:34, score:88.16, p:'Dark Brown',  sh:'Black',  sr:'Stone',            j:'Black'},\n  {id:35, score:88.10, p:'Navy',        sh:'Black',  sr:'Light Grey Shirt', j:'Light Grey'},\n  {id:36, score:87.85, p:'Navy',        sh:'Black',  sr:'Light Grey Shirt', j:'Black'},\n  {id:37, score:87.65, p:'Navy',        sh:'Black',  sr:'Black Shirt',      j:'Light Grey'},\n  {id:38, score:87.43, p:'Navy',        sh:'Black',  sr:'Slate Blue',       j:'Black'},\n  {id:39, score:87.12, p:'Navy',        sh:'Black',  sr:'Mid Grey',         j:'Black'},\n  {id:40, score:87.07, p:'Navy',        sh:'Black',  sr:'Stone',            j:'Black'},\n];\n\nconst CMAP = {\n  'Black':'#1c1c1c','Navy':'#1c2e4a','Oxford Grey':'#5a5d64',\n  'Light Grey':'#9ea2a5','Dark Brown':'#3e2010','Cognac':'#8b4a1e',\n  'White':'#ede8e0','Cream':'#e8dfc8','Light Grey Shirt':'#c2c5c8',\n  'Mid Grey':'#7e8285','Slate Blue':'#5a7290','Black Shirt':'#1c1c1c',\n  'Stone':'#c0b090','Charcoal':'#3a3d3a','Olive':'#4a5e30','Camel':'#b8803a',\n};\nfunction hexOf(n){ return CMAP[n]||'#8C7A6B'; }\nfunction srLabel(n){ return n.replace(' Shirt',''); }\nfunction pieceList(c, small){\n  const defs = small\n    ? [{key:'p',type:'TR'},{key:'sh',type:'SH'},{key:'sr',type:'SR'},{key:'j',type:'JK'}]\n    : [{key:'p',type:'Trousers'},{key:'sh',type:'Shoes'},{key:'sr',type:'Shirt'},{key:'j',type:'Jacket'}];\n  return defs.map(d=>({key:d.key, type:d.type, color:srLabel(c[d.key]), hex:hexOf(c[d.key])}));\n}\n\nfunction isoDate(d){return d.toISOString().split('T')[0];}\nfunction todayStr(){return isoDate(new Date());}\nfunction parseLocal(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}\nfunction addDays(s,n){const d=parseLocal(s);d.setDate(d.getDate()+n);return isoDate(d);}\nconst MO=['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst DO=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nconst DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nfunction fmtDate(s){const d=parseLocal(s);return MS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();}\nfunction fmtFull(s){const d=parseLocal(s);return DO[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate();}\n\nfunction getWears(history,id){return history[String(id)]||[];}\nfunction getLastWorn(history,id){const w=getWears(history,id);return w.length?w[w.length-1]:null;}\nfunction daysSince(ds){if(!ds)return Infinity;return Math.floor((Date.now()-new Date(ds).getTime())/86400000);}\nfunction scoreCombo(history,c){const l=getLastWorn(history,c.id);return l?daysSince(l):Infinity;}\nfunction warnInfo(history,id){\n  const last=getLastWorn(history,id),days=daysSince(last);\n  if(!last)return{level:'never',label:'Never worn — great choice!'};\n  if(days<=14)return{level:'hot',label:'Worn '+days+' day'+(days===1?'':'s')+' ago — too soon'};\n  if(days<=21)return{level:'mild',label:'Worn '+days+' days ago — almost ready'};\n  return{level:'ok',label:'Worn '+days+' days ago — all clear'};\n}\nfunction blockReason(combo,recent){\n  for(let i=0;i<recent.length;i++){\n    const r=recent[i]; if(!r)continue;\n    if(r.p===combo.p)return 'Same trousers as #'+r.id;\n    if(r.j===combo.j)return 'Same jacket as #'+r.id;\n  }\n  return null;\n}\nfunction buildContext(history,plan,targetDate,extraPlanDates){\n  const entries=[];\n  COMBOS.forEach(c=>getWears(history,c.id).forEach(d=>entries.push({id:c.id,date:d})));\n  if(extraPlanDates)extraPlanDates.forEach(pd=>{ if(plan[pd])entries.push({id:plan[pd],date:pd}); });\n  entries.sort((a,b)=> b.date<a.date?-1:b.date>a.date?1:0);\n  return entries.filter(e=>e.date<=targetDate).slice(0,5).map(e=>COMBOS.find(c=>c.id===e.id)).filter(Boolean);\n}\nfunction buildSmartPool(history,plan,targetDate,extraPlanDates){\n  const allDates = extraPlanDates?extraPlanDates.slice():[];\n  const used = Object.values(plan).filter(Boolean);\n  const windows=[5,3,1];\n  for(let wi=0;wi<windows.length;wi++){\n    const ctx=buildContext(history,plan,targetDate,allDates).slice(0,windows[wi]);\n    const pool=COMBOS.filter(c=>!used.includes(c.id)&&!blockReason(c,ctx));\n    if(pool.length>0)return {pool:pool,ctx:ctx};\n  }\n  const prevDate = allDates.length? allDates[allDates.length-1]:null;\n  const prevCombo = prevDate && plan[prevDate] ? COMBOS.find(c=>c.id===plan[prevDate]) : null;\n  const pool2 = COMBOS.filter(c=>{\n    if(used.includes(c.id))return false;\n    if(prevCombo && c.p===prevCombo.p)return false;\n    if(prevCombo && c.j===prevCombo.j)return false;\n    return true;\n  });\n  if(pool2.length>0)return {pool:pool2,ctx:[]};\n  return {pool:COMBOS.filter(c=>!used.includes(c.id)), ctx:[]};\n}\nfunction autoRecommend(history,plan,excludeIds){\n  const today=todayStr();\n  const plannedDates=Object.keys(plan).filter(d=>d<today&&plan[d]);\n  const ctx=buildContext(history,plan,today,plannedDates);\n  let pool=COMBOS.filter(c=>!excludeIds.includes(c.id)&&!blockReason(c,ctx));\n  if(!pool.length)pool=COMBOS.filter(c=>!excludeIds.includes(c.id));\n  pool.sort((a,b)=>scoreCombo(history,b)-scoreCombo(history,a));\n  return pool[0]||null;\n}\n\nconst PIECE_DEFS = [\n  {key:'p',  label:'Trousers', colors:['Black','Navy','Oxford Grey','Light Grey','Dark Brown']},\n  {key:'sh', label:'Shoes',    colors:['Black','Cognac']},\n  {key:'sr', label:'Shirt',    colors:['White','Cream','Light Grey Shirt','Mid Grey','Slate Blue','Black Shirt','Stone']},\n  {key:'j',  label:'Jacket',   colors:['Black','Charcoal','Olive','Light Grey','Camel','Dark Brown']},\n];\nconst PIECE_SVGS = {\n  p:  '<svg width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" viewBox=\"0 0 24 24\"><path d=\"M6 2h12l-1 10H7L6 2z\"/><path d=\"M7 12l-2 10h6l1-5 1 5h6l-2-10\"/><\u002Fsvg>',\n  sh: '<svg width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" viewBox=\"0 0 24 24\"><path d=\"M3 17c0-1.7 1.3-4 3.5-4H10l2-5h5c1 0 2.5 1.2 3 3.5L21 13a2 2 0 0 1-2 2H5.5A2.5 2.5 0 0 1 3 17z\"/><line x1=\"3\" y1=\"17\" x2=\"21\" y2=\"17\"/><\u002Fsvg>',\n  sr: '<svg width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" viewBox=\"0 0 24 24\"><path d=\"M3 7c0-1 .9-2 2-2h2.5L9 8 7.5 9v11h9V9L15 8l1.5-3H19c1.1 0 2 .9 2 2v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z\"/><path d=\"M9 5c0 1.7 1.3 3 3 3s3-1.3 3-3\"/><\u002Fsvg>',\n  j:  '<svg width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" viewBox=\"0 0 24 24\"><path d=\"M3 7c0-1 .9-2 2-2l4 3-1 1.5V20H4a1 1 0 0 1-1-1V7z\"/><path d=\"M21 7c0-1-.9-2-2-2l-4 3 1 1.5V20h4a1 1 0 0 0 1-1V7z\"/><path d=\"M9 8l3 2 3-2\"/><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"20\"/><\u002Fsvg>',\n};\nfunction getPieceDef(key){ return PIECE_DEFS.find(d=>d.key===key)||null; }\n\nclass Component extends DCLogic {\n  state = {\n    screen:'today', weekOffset:0, wardrobeSearch:'', wardrobeFilter:'all',\n    history: loadLS(SK_H,{}), plan: loadLS(SK_P,{}),\n    modal: null, toast:''\n  };\n\n  goScreen(name){ this.setState({screen:name}); }\n  showToast(msg){\n    this.setState({toast:msg});\n    clearTimeout(this._t);\n    this._t = setTimeout(()=>this.setState({toast:''}),2600);\n  }\n  saveHistory(h){ saveLS(SK_H,h); this.setState({history:h}); }\n  savePlan(p){ saveLS(SK_P,p); this.setState({plan:p}); }\n  addWear(id,ds){\n    const h={...this.state.history}; const k=String(id);\n    const arr = h[k]?[...h[k]]:[];\n    if(!arr.includes(ds)){arr.push(ds);arr.sort();}\n    h[k]=arr; this.saveHistory(h);\n  }\n  removeWear(id,ds){\n    const h={...this.state.history}; const k=String(id);\n    if(h[k]) h[k]=h[k].filter(d=>d!==ds);\n    this.saveHistory(h);\n  }\n\n  confirmComboToday(id){\n    const ds=todayStr();\n    const p={...this.state.plan}; p[ds]=id; saveLS(SK_P,p);\n    const h={...this.state.history}; const k=String(id);\n    const arr=h[k]?[...h[k]]:[]; if(!arr.includes(ds))arr.push(ds); h[k]=arr; saveLS(SK_H,h);\n    this.setState({plan:p, history:h, modal:null});\n    this.showToast('Combo #'+id+' logged');\n  }\n\n  openAutoRecommend(){\n    const c = autoRecommend(this.state.history, this.state.plan, []);\n    if(!c){ this.showToast('No combinations available'); return; }\n    this.setState({modal:{type:'auto', comboId:c.id}});\n  }\n  openWearModal(id){ this.setState({modal:{type:'wear', comboId:id}}); }\n  openHistoryModal(id){ this.setState({modal:{type:'history', comboId:id}}); }\n  openPickManual(ds, preselect){\n    this.setState({modal:{type:'picker', pickerDate: ds||todayStr(), pickerStep:1, pickerType:'', pickerColor:'', selectedId: preselect||null, warnedHot:false}});\n  }\n  closeModal(){ this.setState({modal:null}); }\n\n  pickerGoStep(n){\n    this.setState(s=>{\n      const m={...s.modal, pickerStep:n};\n      if(n===1){ m.pickerType=''; m.pickerColor=''; m.selectedId=null; }\n      if(n===2){ m.pickerColor=''; m.selectedId=null; }\n      return {modal:m};\n    });\n  }\n  pickerSelectType(key){ this.setState(s=>({modal:{...s.modal, pickerType:key, pickerStep:2, selectedId:null}})); }\n  pickerSelectColor(val){ this.setState(s=>({modal:{...s.modal, pickerColor:val, pickerStep:3, selectedId:null}})); }\n  prSelectCard(id){ this.setState(s=>({modal:{...s.modal, selectedId:id}})); }\n  doPickConfirm(){\n    const m=this.state.modal; if(!m || !m.selectedId || !m.pickerDate) return;\n    const w=warnInfo(this.state.history, m.selectedId);\n    if(w.level==='hot' && !m.warnedHot){ this.setState({modal:{...m, warnedHot:true}}); return; }\n    const p={...this.state.plan}; p[m.pickerDate]=m.selectedId; saveLS(SK_P,p);\n    this.setState({plan:p, modal:null});\n    this.showToast('Combo #'+m.selectedId+' planned');\n  }\n\n  shiftWeek(delta){ this.setState(s=>({weekOffset:s.weekOffset+delta})); }\n  getWeekDates(offset){\n    const today=todayStr(), d=parseLocal(today), dow=d.getDay();\n    const start=new Date(d);\n    start.setDate(d.getDate()-(dow===0?6:dow-1)+offset*7);\n    return Array.from({length:7},(_,i)=>{const day=new Date(start);day.setDate(start.getDate()+i);return isoDate(day);});\n  }\n  removePlanDate(ds){ const p={...this.state.plan}; delete p[ds]; this.savePlan(p); this.showToast('Plan removed'); }\n  quickAutoAssign(ds){\n    const allPlanDates=Object.keys(this.state.plan).filter(d=>d!==ds&&this.state.plan[d]).sort();\n    const result=buildSmartPool(this.state.history, this.state.plan, ds, allPlanDates);\n    result.pool.sort((a,b)=>scoreCombo(this.state.history,b)-scoreCombo(this.state.history,a));\n    const p={...this.state.plan}; p[ds]=result.pool[0].id; this.savePlan(p);\n    this.showToast('Combo #'+result.pool[0].id+' assigned');\n  }\n  confirmWornDay(ds,id){ this.addWear(id,ds); this.showToast('Outfit confirmed'); }\n  doAutoFillWeek(){\n    const dates=this.getWeekDates(this.state.weekOffset), today=todayStr();\n    const p={...this.state.plan};\n    dates.forEach(ds=>{\n      if(p[ds]||ds<today)return;\n      const plannedSoFar=dates.filter(pd=>pd!==ds&&p[pd]).sort();\n      const result=buildSmartPool(this.state.history,p,ds,plannedSoFar);\n      result.pool.sort((a,b)=>scoreCombo(this.state.history,b)-scoreCombo(this.state.history,a));\n      if(result.pool[0]) p[ds]=result.pool[0].id;\n    });\n    this.savePlan(p);\n    this.showToast('Week auto-filled');\n  }\n\n  setWardrobeFilter(f){ this.setState({wardrobeFilter:f}); }\n  setWardrobeSearch(e){ this.setState({wardrobeSearch:e.target.value}); }\n\n  renderVals(){\n    const { screen, weekOffset, wardrobeSearch, wardrobeFilter, history, plan, modal, toast } = this.state;\n    const today = todayStr();\n    const stop = e=>e.stopPropagation();\n\n    // TODAY\n    const todayId = plan[today];\n    const todayCombo = todayId ? COMBOS.find(c=>c.id===todayId) : null;\n    const todayWorn = todayId ? getWears(history,todayId).includes(today) : false;\n    const dToday = parseLocal(today);\n    const todayDateLabel = DO[dToday.getDay()]+', '+MO[dToday.getMonth()]+' '+dToday.getDate();\n    const todayPieces = todayCombo ? pieceList(todayCombo,false) : [];\n\n    let todayChipLabel='', todayChipBg='', todayChipColor='';\n    if(todayCombo){\n      if(todayWorn){ todayChipLabel='Worn ✓'; todayChipBg='#EFE8DE'; todayChipColor='#8C7A6B'; }\n      else { todayChipLabel='Planned'; todayChipBg='#EAF0E7'; todayChipColor='#5c7a5f'; }\n    }\n\n    const upcoming=[];\n    for(let i=1;i<=14;i++){ const ds=addDays(today,i); if(plan[ds])upcoming.push(ds); if(upcoming.length>=5)break; }\n    const upcomingList = upcoming.map(ds=>{\n      const dd=parseLocal(ds); const c=COMBOS.find(x=>x.id===plan[ds]);\n      return {date:ds, dow:DS[dd.getDay()], day:dd.getDate(), comboId:c.id, score:c.score, pieces:pieceList(c,true)};\n    });\n\n    // PLAN\n    const weekDates = this.getWeekDates(weekOffset);\n    const wf=parseLocal(weekDates[0]), wl=parseLocal(weekDates[6]);\n    const weekLabel = MS[wf.getMonth()]+' '+wf.getDate()+' – '+MS[wl.getMonth()]+' '+wl.getDate()+', '+wl.getFullYear();\n    const weekDays = weekDates.map(ds=>{\n      const dd=parseLocal(ds), isPast= ds<today, isToday= ds===today;\n      const hasPlan=!!plan[ds]; const c= hasPlan?COMBOS.find(x=>x.id===plan[ds]):null;\n      const worn = c? getWears(history,c.id).includes(ds): false;\n      const showAssign = !isPast && !hasPlan;\n      const showChange = !isPast && hasPlan && !worn;\n      const showConfirmToday = !isPast && hasPlan && !worn && isToday;\n      const showConfirmedLabel = !isPast && hasPlan && worn;\n      return {\n        date:ds, dow:DS[dd.getDay()], day:dd.getDate(),\n        borderColor: isToday? '#A3B19B' : (hasPlan? '#E3DACD':'#F2ECE3'),\n        dayColor: isToday? '#8C7A6B':'#1A1A1A',\n        opacity: isPast? '.5':'1',\n        hasPlan, comboId: c?c.id:null, wornMark: worn?' ✓':'',\n        pieces: c? pieceList(c,true):[],\n        showAssign, showChange, showConfirmToday, showConfirmedLabel,\n        showActions: showAssign||showChange||showConfirmToday||showConfirmedLabel,\n        assignClick: ()=>this.openPickManual(ds),\n        autoClick: ()=>this.quickAutoAssign(ds),\n        removeClick: ()=>this.removePlanDate(ds),\n        confirmClick: c? ()=>this.confirmWornDay(ds,c.id) : null,\n      };\n    });\n\n    // WARDROBE\n    const q=(wardrobeSearch||'').toLowerCase();\n    let wList=[...COMBOS];\n    if(q) wList=wList.filter(c=>[c.p,c.sh,c.sr,c.j,'Trousers','Shoes','Shirt','Jacket'].some(v=>v.toLowerCase().includes(q)));\n    if(wardrobeFilter==='never') wList=wList.filter(c=>!getLastWorn(history,c.id));\n    else if(wardrobeFilter==='available') wList=wList.filter(c=>daysSince(getLastWorn(history,c.id))>21);\n    else if(wardrobeFilter==='recent') wList=wList.filter(c=>daysSince(getLastWorn(history,c.id))<=21);\n\n    const allW=COMBOS.flatMap(c=>getWears(history,c.id));\n    const neverCt=COMBOS.filter(c=>!getLastWorn(history,c.id)).length;\n    let favId='—', maxW=0;\n    COMBOS.forEach(c=>{ const w=getWears(history,c.id).length; if(w>maxW){maxW=w; favId='#'+c.id;} });\n\n    const filterDefs=[['all','All'],['never','Never worn'],['available','Available'],['recent','Used recently']];\n    const wardrobeFilters = filterDefs.map(([key,label])=>{\n      const active = wardrobeFilter===key;\n      return { label, onClick:()=>this.setWardrobeFilter(key),\n        bg: active?'#8C7A6B':'transparent', color: active?'#F9F8F6':'#6b6459',\n        borderColor: active?'#8C7A6B':'#E3DACD' };\n    });\n\n    const BADGE = {\n      hot:{bg:'#F3DFD8',color:'#a15d4c',label:'Too soon'},\n      mild:{bg:'#EFE3D0',color:'#8a6a34',label:'Almost ready'},\n      ok:{bg:'#E4EBE1',color:'#4f6a52',label:'Available'},\n      never:{bg:'#EFE8DE',color:'#8C7A6B',label:'Never worn'},\n    };\n    const wardrobeCards = wList.map(c=>{\n      const w=warnInfo(history,c.id); const wears=getWears(history,c.id); const last=getLastWorn(history,c.id);\n      const b=BADGE[w.level];\n      const lastColor = w.level==='hot'?'#a15d4c': w.level==='mild'?'#8a6a34': w.level==='never'?'#a39a8c':'#5c7a5f';\n      return {\n        id:c.id, score:c.score, wearsCount:wears.length,\n        borderColor: w.level==='hot'?'#E3B7A6': w.level==='mild'?'#D9C79A':'#E3DACD',\n        badgeBg:b.bg, badgeColor:b.color, badgeLabel:b.label,\n        pieces: pieceList(c,true),\n        lastColor, lastLabel: w.label,\n        wearClick: ()=>this.openWearModal(c.id),\n        historyClick: ()=>this.openHistoryModal(c.id),\n        planClick: ()=>this.openPickManual(todayStr(), null),\n      };\n    });\n\n    // MODAL\n    let modalTitle='', modalSubtitle='';\n    let isModalWear=false, isModalHistory=false, isModalAuto=false, isModalPicker=false;\n    let modalWarnBg='', modalWarnBorder='', modalWarnColor='', modalWarnLabel='';\n    let modalPieces=[];\n    let modalHistory=[], historyEmpty=false;\n    let modalAutoId=null, modalAutoScore='', modalAutoWhy='';\n    let pickerStep1=false, pickerStep2=false, pickerStep3=false;\n    let pickerTypeGrid=[], pickerColorGrid=[], pickerResults=[];\n    let crumbType='', crumbColor='', pickerShowTypeCrumb=false, pickerShowColorCrumb=false, pickerShowReset=false;\n    let crumbTypeColorStep1='#8C7A6B', crumbTypeColorStep2='#a39a8c';\n    let pickerResultsSummary='';\n    let pickerConfirmLabel='', pickerConfirmBg='#8C7A6B', pickerConfirmColor='#F9F8F6', pickerConfirmOpacity='1';\n\n    const WARN_STYLE = {\n      hot:{bg:'#F8ECE7',border:'#E3B7A6',color:'#a15d4c'},\n      mild:{bg:'#F7F1E2',border:'#D9C79A',color:'#8a6a34'},\n      ok:{bg:'#EDF2EA',border:'#B9CBB2',color:'#4f6a52'},\n      never:{bg:'#EDF2EA',border:'#B9CBB2',color:'#4f6a52'},\n    };\n\n    if(modal){\n      if(modal.type==='wear'){\n        isModalWear=true;\n        const c=COMBOS.find(x=>x.id===modal.comboId), w=warnInfo(history,c.id);\n        modalTitle='Combo #'+c.id; modalSubtitle='Harmony '+c.score;\n        modalPieces=pieceList(c,false);\n        const ws=WARN_STYLE[w.level]||WARN_STYLE.ok;\n        modalWarnBg=ws.bg; modalWarnBorder=ws.border; modalWarnColor=ws.color; modalWarnLabel=w.label;\n      } else if(modal.type==='history'){\n        isModalHistory=true;\n        const c=COMBOS.find(x=>x.id===modal.comboId);\n        modalTitle='Combo #'+c.id+' — History';\n        modalSubtitle=c.p+' · '+c.sh+' · '+srLabel(c.sr)+' · '+c.j;\n        const wears=[...getWears(history,c.id)].reverse();\n        historyEmpty = wears.length===0;\n        modalHistory = wears.map(ds=>({date:ds, label:fmtDate(ds), delClick:()=>this.removeWear(c.id,ds)}));\n      } else if(modal.type==='auto'){\n        isModalAuto=true;\n        const c=COMBOS.find(x=>x.id===modal.comboId);\n        const last=getLastWorn(history,c.id);\n        modalTitle='Suggested Outfit'; modalSubtitle='For today — '+fmtFull(today);\n        modalAutoId=c.id; modalAutoScore=c.score;\n        modalAutoWhy = (last? 'Last worn '+daysSince(last)+' days ago':'Never worn before')+' · No trouser or jacket conflict';\n        modalPieces=pieceList(c,false);\n      } else if(modal.type==='picker'){\n        isModalPicker=true;\n        const step=modal.pickerStep;\n        pickerStep1 = step===1; pickerStep2 = step===2; pickerStep3 = step===3;\n        const def = modal.pickerType? getPieceDef(modal.pickerType):null;\n        crumbType = def?def.label:''; crumbColor = modal.pickerColor?srLabel(modal.pickerColor):'';\n        pickerShowTypeCrumb = step>=2; pickerShowColorCrumb = step>=3; pickerShowReset = step>1;\n        crumbTypeColorStep1 = step===1? '#8C7A6B':'#a39a8c';\n        crumbTypeColorStep2 = step===2? '#8C7A6B':'#a39a8c';\n        const dLabel = parseLocal(modal.pickerDate);\n        modalTitle='Pick an Outfit'; modalSubtitle=DO[dLabel.getDay()]+', '+MO[dLabel.getMonth()]+' '+dLabel.getDate();\n\n        if(step===1){\n          pickerTypeGrid = PIECE_DEFS.map(d=>({key:d.key, label:d.label, count:d.colors.length, svg:PIECE_SVGS[d.key], onClick:()=>this.pickerSelectType(d.key)}));\n        } else if(step===2 && def){\n          pickerColorGrid = def.colors.map(cv=>({name:cv, label:srLabel(cv), hex:hexOf(cv), count:COMBOS.filter(x=>x[modal.pickerType]===cv).length, onClick:()=>this.pickerSelectColor(cv)}));\n        } else if(step===3){\n          const otherDates=Object.keys(plan).filter(dt=>dt!==modal.pickerDate && plan[dt]);\n          const ctx=buildContext(history,plan,modal.pickerDate,otherDates);\n          let filtered=COMBOS.filter(c=>c[modal.pickerType]===modal.pickerColor);\n          filtered.sort((a,b)=>scoreCombo(history,b)-scoreCombo(history,a));\n          pickerResultsSummary = filtered.length+' combinations with '+srLabel(modal.pickerColor)+' '+(def?def.label.toLowerCase():'');\n          pickerResults = filtered.map(c=>{\n            const br=blockReason(c,ctx), w=warnInfo(history,c.id), sel=modal.selectedId===c.id;\n            let tagLabel, tagColor;\n            if(br){ tagLabel='⚠ '+br; tagColor='#a15d4c'; }\n            else if(w.level==='hot'){ tagLabel='⚠ Too soon'; tagColor='#a15d4c'; }\n            else if(w.level==='mild'){ tagLabel='○ Almost ready'; tagColor='#8a6a34'; }\n            else if(w.level==='never'){ tagLabel='✦ Never worn'; tagColor='#4f6a52'; }\n            else { tagLabel='✓ Available'; tagColor='#4f6a52'; }\n            const pieces = pieceList(c,false).map(pc=>({...pc, bg: pc.key===modal.pickerType ? '#F3EFE7' : '#FFFFFF'}));\n            return {\n              id:c.id, score:c.score, tagLabel, tagColor, pieces,\n              cardBg: sel? '#F3EFE7':'#FFFFFF',\n              cardBorder: sel? '#8C7A6B':'#E3DACD',\n              opacity: br? '.35':'1',\n              onClick: br? null : ()=>this.prSelectCard(c.id),\n            };\n          });\n        }\n        const lbl = modal.pickerDate===today? 'today': fmtFull(modal.pickerDate);\n        pickerConfirmOpacity = modal.selectedId? '1':'.4';\n        pickerConfirmLabel = modal.warnedHot? 'Worn recently — tap again to confirm' : ('Assign to '+lbl);\n        pickerConfirmBg = modal.warnedHot? '#D9B4A7' : '#8C7A6B';\n        pickerConfirmColor = modal.warnedHot? '#1A1A1A' : '#F9F8F6';\n      }\n    }\n\n    return {\n      isToday: screen==='today', isPlan: screen==='plan', isWardrobe: screen==='wardrobe',\n      goToday: ()=>this.goScreen('today'), goPlan: ()=>this.goScreen('plan'), goWardrobe: ()=>this.goScreen('wardrobe'),\n      navTodayColor: screen==='today'?'#8C7A6B':'#a39a8c',\n      navPlanColor: screen==='plan'?'#8C7A6B':'#a39a8c',\n      navWardrobeColor: screen==='wardrobe'?'#8C7A6B':'#a39a8c',\n\n      todayDateLabel, todayHasCombo: !!todayCombo, todayEmpty: !todayCombo,\n      todayComboId: todayCombo?todayCombo.id:null, todayComboScore: todayCombo?todayCombo.score:null,\n      todayPieces, todayChipLabel, todayChipBg, todayChipColor,\n      todayShowConfirm: !!todayCombo && !todayWorn, todayShowConfirmed: !!todayCombo && todayWorn,\n      confirmWornTodayClick: todayId? ()=>{ this.addWear(todayId,today); this.showToast('Outfit logged'); } : null,\n      openPickManualToday: ()=>this.openPickManual(today),\n      openAutoRecommendClick: ()=>this.openAutoRecommend(),\n      upcomingEmpty: upcomingList.length===0, upcomingList,\n\n      weekLabel, weekPrev: ()=>this.shiftWeek(-1), weekNext: ()=>this.shiftWeek(1),\n      doAutoFillWeekClick: ()=>this.doAutoFillWeek(), weekDays,\n\n      wardrobeSearch, setWardrobeSearch: e=>this.setWardrobeSearch(e), wardrobeFilters,\n      wsTotal:40, wsWorn:allW.length, wsNever:neverCt, wsFav:favId,\n      wardrobeEmpty: wardrobeCards.length===0, wardrobeCards,\n\n      modalOpen: !!modal, closeModalBg: ()=>this.closeModal(), stopProp: stop, closeModal: ()=>this.closeModal(),\n      modalTitle, modalSubtitle,\n      isModalWear, isModalHistory, isModalAuto, isModalPicker,\n      modalWarnBg, modalWarnBorder, modalWarnColor, modalWarnLabel, modalPieces,\n      modalHistory, historyEmpty,\n      modalAutoId, modalAutoScore, modalAutoWhy,\n      modalWearConfirm: modal&&modal.type==='wear' ? ()=>this.confirmComboToday(modal.comboId) : null,\n      modalAutoConfirm: modal&&modal.type==='auto' ? ()=>this.confirmComboToday(modal.comboId) : null,\n\n      pickerStep1, pickerStep2, pickerStep3,\n      pickerTypeGrid, pickerColorGrid, pickerResults, pickerResultsSummary,\n      crumbType, crumbColor, pickerShowTypeCrumb, pickerShowColorCrumb, pickerShowReset,\n      crumbTypeColorStep1, crumbTypeColorStep2,\n      pickerReset: ()=>this.pickerGoStep(1),\n      pickerConfirmLabel, pickerConfirmBg, pickerConfirmColor, pickerConfirmOpacity,\n      pickerConfirmClick: ()=>this.doPickConfirm(),\n\n      toastShow: !!toast, toastMsg: toast,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
